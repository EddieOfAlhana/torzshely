services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: torzshely
      POSTGRES_USER: ${DB_USER:-torzshely}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-torzshely_secret}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torzshely"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/torzshely
      DB_USER: ${DB_USER:-torzshely}
      DB_PASSWORD: ${DB_PASSWORD:-torzshely_secret}
      JWT_SECRET: ${JWT_SECRET:-torzshely16-super-secret-jwt-key-at-least-256-bits-long-for-hs256-algo}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-torzshely2025}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-torzshely16@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_TO: ${MAIL_TO:-torzshely16@gmail.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  uploads:
